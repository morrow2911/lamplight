<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#17263d"><title>Lamplight</title><style>
*{box-sizing:border-box}body{margin:0;background:#17263d;color:#aabbd0;font-family:Courier New,monospace}main{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:auto;padding:12px 20px env(safe-area-inset-bottom)}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.75}button{background:none;color:inherit;border:1px solid #60758a;border-radius:6px;padding:8px;font:inherit}#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(ellipse 150px 115px at var(--x,50%) var(--y,70%),#b9d2ed88,transparent 100%);cursor:text}#paper{position:absolute;inset:0;overflow:auto;scrollbar-width:none;padding:40vh 12px 90px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.75;color:#101b2c;mask-image:radial-gradient(ellipse 180px 140px at var(--x,50%) var(--y,70%),black 20%,#0007 65%,transparent 100%)}#lamp{position:absolute;left:var(--x,50%);top:var(--y,70%);transform:translate(-50%,14px);pointer-events:none;filter:drop-shadow(0 0 9px #c4e4ff)}#entry{position:absolute;left:0;bottom:0;width:100%;height:44px;opacity:.01;font-size:16px;resize:none;border:0}#cursor{display:inline-block;width:2px;height:1em;background:#24354a;vertical-align:middle}footer{text-align:center;font-size:11px;padding:10px;opacity:.65}svg{display:block}</style></head><body><main><header><span>LAMPLIGHT</span><div><button id="save">Export</button> <button id="reset">New</button></div></header><div id="stage"><div id="paper"><span id="words"></span><span id="cursor"></span></div><div id="lamp"><svg width="32" height="30" viewBox="0 0 32 30"><path d="M7 13 L12 3 H20 L25 13Z" fill="#d9edff"/><path d="M16 13V25 M8 26H24" stroke="#b8cfe7" stroke-width="2"/></svg></div><textarea id="entry" aria-label="Write and edit here" autocorrect="off" autocomplete="off" autocapitalize="sentences" spellcheck="false" inputmode="text"></textarea></div><footer id="status">Tap the page to begin writing</footer></main><script>
const $=id=>document.getElementById(id), entry=$('entry'), words=$('words'), paper=$('paper'), stage=$('stage'), cursor=$('cursor');let draft='';try{draft=localStorage.getItem('lamplight-draft')||''}catch{}let composing=false;function render(){words.textContent=draft;paper.scrollTop=paper.scrollHeight;let r=cursor.getBoundingClientRect(),s=stage.getBoundingClientRect();stage.style.setProperty('--x',Math.max(15,Math.min(s.width-15,r.left-s.left))+'px');stage.style.setProperty('--y',Math.max(15,r.top-s.top+12)+'px');let saved=true;try{localStorage.setItem('lamplight-draft',draft)}catch{saved=false}$('status').textContent=(draft.trim()?draft.trim().split(/\s+/).length:0)+' words · '+(saved?'Saved on this device':'Storage unavailable — export your draft');}function commit(){if(composing)return;draft=entry.value;render()}entry.value=draft;entry.addEventListener('compositionstart',()=>composing=true);entry.addEventListener('compositionend',()=>{composing=false;commit()});entry.addEventListener('input',commit);stage.addEventListener('click',()=>entry.focus());window.addEventListener('resize',render);window.visualViewport?.addEventListener('resize',()=>{document.querySelector('main').style.height=window.visualViewport.height+'px';render()});$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([draft],{type:'text/plain'}));a.download='lamplight-'+new Date().toISOString().slice(0,10)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('reset').onclick=()=>{if(confirm('Start a new page? Export your current writing first.')){draft='';entry.value='';render()}};render();</script></body></html>
